name: ✨ Feature request
description: Propose a new capability or an improvement to an existing one.
title: "[Area] "
labels: ["feature-request"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose **what** the app should do and **why**. You don't need to know how to build it. Implementation details can be worked out in the comments.

        - Replace `[Area]` in the title with the affected area and a short summary, e.g. `[App] Numerical input for selected points`.
          Areas: `[App]` `[Rendering]` `[Controller]` `[Geometry]` `[Simulation]` `[Data]` `[Collaboration]` `[Build]` `[Docs]`
        - If the work is already agreed on and just needs to be broken down and assigned, use the **Task** template instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part(s) of the app would this touch? Select all that apply.
      multiple: true
      options:
        - App (menus, inputs, Qt windows and sidebars)
        - Rendering (3D viewport, viewing windows, camera)
        - Controller (model state, points/curves/surfaces, user actions)
        - Geometry (geometry data structures and math, NURBS)
        - Simulation (hydrostatics, curvature maps, analysis)
        - Data (save files, SolidWorks and Excel import/export)
        - Collaboration (version control, shared state)
        - Build / CI
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What can't users do today, or what is harder than it should be? Who is affected? Mention the naval architecture or design context if relevant.
      placeholder: Points can only be moved by dragging, so it's impossible to place them at exact coordinates. Hull design needs exact offsets and perfect symmetry about the centreline.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what the feature should do from the user's point of view.
      placeholder: Add a sidebar showing the X, Y, Z coordinates of the selected point. Typing a new value and pressing Enter moves the point.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist of conditions that must all be true for this feature to be considered done. Write each as a testable statement.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you prefer the one above. Optional.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to how FREE!ship or other CAD tools handle this, screenshots, mockups, related issues (`#12`), or documentation. Optional.

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      description: Your opinion only. Leads set the final priority.
      options:
        - Low (nice to have)
        - Medium (should be done this milestone)
        - High (blocks other work or the milestone)
        
