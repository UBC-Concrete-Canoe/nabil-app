name: CI Image

# Builds the dependency image used by the Linux container job in ci.yml and
# pushes it to ghcr.io. The image only needs rebuilding when the Dockerfile
# or the OCCT build script change - PR builds reuse the pushed image.

on:
  push:
    branches: [main]
    paths:
      - ci/Dockerfile
      - ci/install-occt.sh
      - .github/workflows/ci-image.yml
  pull_request:
    paths:
      - ci/Dockerfile
      - ci/install-occt.sh
      - .github/workflows/ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build CI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/ubc-concrete-canoe/nabil-app/ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
